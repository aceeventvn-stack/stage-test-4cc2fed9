<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive,noai,noimageai"><title>WeCEO Stage Studio</title>
<style>body{margin:0;background:#071727;color:#F2EFE8;font:15px system-ui,sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;flex-direction:column}#b{width:260px;height:6px;background:rgba(255,255,255,.15);border-radius:6px;overflow:hidden;margin-top:14px}#b i{display:block;height:100%;width:0;background:#C9A227;transition:width .2s}</style></head>
<body><div>Đang tải WeCEO Stage Studio…</div><div id="b"><i id="p"></i></div>
<script>(async function(){var N=10,got=0,parts=new Array(N);
async function one(i){var u="p"+String(i).padStart(2,"0")+".txt";for(var t=0;t<3;t++){try{var r=await fetch(u);if(!r.ok)throw 0;parts[i]=await r.text();got++;document.getElementById("p").style.width=(got/N*100)+"%";return}catch(e){}}throw new Error("Không tải được "+u)}
try{var q=[];for(var i=0;i<N;i++)q.push(one(i));await Promise.all(q);var html=parts.join("");parts=null;document.open();document.write(html);document.close()}catch(e){document.body.innerHTML="<p style='padding:24px'>Chưa tải được app ("+e.message+"). Vui lòng tải lại trang.</p>"}})();</script></body></html>
