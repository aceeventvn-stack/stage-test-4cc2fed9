<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive,noai,noimageai"><title>WeCEO Stage Studio</title>
<style>body{margin:0;background:#071727;color:#F2EFE8;font:15px system-ui,sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;flex-direction:column;text-align:center;padding:0 20px;box-sizing:border-box}#b{width:280px;height:8px;background:rgba(255,255,255,.15);border-radius:8px;overflow:hidden;margin:16px 0 10px}#b i{display:block;height:100%;width:0;background:#C9A227}small{color:#A9B8CD;max-width:320px;line-height:1.5}</style></head>
<body><div id="t">Đang tải WeCEO Stage Studio…</div><div id="b"><i id="p"></i></div><small id="s">Lần đầu mở sẽ lâu hơn vì app nặng. Từ lần sau app được lưu trên máy nên mở ngay.</small>
<script>(async function(){
var NAMES=["v14-00.txt", "v14-01.txt", "p02.txt", "p03.txt", "p04.txt", "p05.txt", "p06.txt", "p07.txt", "p08.txt", "v14-09.txt"],SIZES=[8163330, 8420513, 7532694, 8271185, 7067216, 6742827, 8066121, 8275266, 5580624, 5330714],N=SIZES.length,TOT=SIZES.reduce(function(a,b){return a+b},0),V="v140",KEY="wc-stage-"+V,done=0,parts=new Array(N),cache=null;
function ui(){var f=Math.min(1,done/TOT);document.getElementById("p").style.width=(f*100).toFixed(1)+"%";document.getElementById("t").textContent="Đang tải WeCEO Stage Studio… "+Math.round(f*100)+"% ("+(done/1e6).toFixed(0)+"/"+(TOT/1e6).toFixed(0)+" MB)"}
try{cache=await caches.open(KEY);(await caches.keys()).forEach(function(k){if(k.indexOf("wc-stage-")===0&&k!==KEY)caches.delete(k)})}catch(e){cache=null}
function join(a){var n=0,i;for(i=0;i<a.length;i++)n+=a[i].length;var o=new Uint8Array(n),p=0;for(i=0;i<a.length;i++){o.set(a[i],p);p+=a[i].length}return o}
async function one(i){var u=NAMES[i];
if(cache){try{var m=await cache.match(u);if(m){var ab=await m.arrayBuffer();if(ab.byteLength===SIZES[i]){parts[i]=new TextDecoder().decode(ab);done+=SIZES[i];ui();return}}}catch(e){}}
for(var t=0;t<3;t++){try{var r=await fetch(u);if(!r.ok)throw 0;var rd=r.body.getReader(),ch=[],got=0;for(;;){var x=await rd.read();if(x.done)break;ch.push(x.value);got+=x.value.length;done+=x.value.length;ui()}var buf=join(ch);if(buf.length!==SIZES[i])throw 0;parts[i]=new TextDecoder().decode(buf);if(cache){try{await cache.put(u,new Response(buf))}catch(e){}}return}catch(e){done-=got||0;if(t===2)throw new Error("Không tải được "+u)}}}
try{ui();await Promise.all(Array.from({length:N},function(_,i){return one(i)}));document.getElementById("t").textContent="Đang khởi động app…";document.getElementById("p").style.width="100%";await new Promise(function(r){setTimeout(r,50)});var html=parts.join("");parts=null;document.open();document.write(html);document.close()}catch(e){document.body.innerHTML="<p style='padding:24px'>Chưa tải được app ("+e.message+"). Vui lòng tải lại trang.</p>"}})();</script></body></html>
